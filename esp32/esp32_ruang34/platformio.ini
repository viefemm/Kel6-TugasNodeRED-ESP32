; PlatformIO Project Configuration File
; Multi-environment configuration for Kelompok 6:
; - env:esp32_ruang12 -> ESP32 #1 (Ruang 1 & Ruang 2)
; - env:esp32_ruang34 -> ESP32 #2 (Ruang 3 & Ruang 4)

[platformio]
default_envs = esp32_ruang12

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

